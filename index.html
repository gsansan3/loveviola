<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="運命の弦楽器診断">
<meta property="og:description" content="質問に答えていくと、あなたに最適な楽器が判定されます。（※最新のAIを活用して作成したため、極めて客観的かつ正確な判定が得られます！たぶん）">
<meta property="og:image" content="https://gsansan33.github.io/loveviola/thumbnail.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>運命の弦楽器診断</title>
<style>
  body {
    background-color: #000;
    color: #fff;
    font-family: 'Courier New', Courier, monospace, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .window {
    border: 4px solid #fff;
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 550px;
    background-color: #000;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    box-sizing: border-box;
  }
  .text-box {
    min-height: 90px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 16px;
    white-space: pre-wrap;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
  }
  @media (hover: hover) and (pointer: fine) {
    button:hover {
      background: #fff;
      color: #000;
    }
  }
  .result-title {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 5px;
  }
  .reason-box {
    background: #111;
    border: 1px dashed #aaa;
    padding: 10px 12px;
    margin: 8px 0;
    font-size: 14px;
    line-height: 1.4;
    color: #fff;
  }
  /* 小見出し（黄色） */
  .reason-item {
    font-weight: bold;
    color: #ffeb3b;
    margin-top: 6px;
    margin-bottom: 0;
  }
  .reason-item:first-child {
    margin-top: 0;
  }
  .reason-text {
    margin-top: 2px;
    margin-bottom: 6px;
    padding-left: 8px;
    white-space: pre-wrap;
  }
  .reason-text:last-child {
    margin-bottom: 0;
  }
  .result-img-container {
    text-align: center;
    margin: 10px 0;
  }
  .result-img {
    max-width: 100%;
    height: auto;
    max-height: 250px;
    border: 2px solid #fff;
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
  }

  /* 【ヴィオラ（Viola）】タイトル表示（シンプル＆レトロなスタイル） */
  .perfect-viola-title {
    background-color: #cc0000;
    color: #ffffff;
    padding: 6px 12px;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid #ffffff;
    display: inline-block;
  }

  /* ひと昔前の個人ホームページ風（ピンク背景固定・アニメーションなし） */
  .highlight-ai-retro {
    font-weight: bold;
    font-size: 1.1em;
    padding: 2px 4px;
    color: #00ff00;
    background-color: #ff00ff;
    border: 2px outset #ffffff;
  }

  /* 理由テキスト内の強調カラー（ピンク） */
  .hl-pink {
    color: #ff69b4;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="window">
  <div id="text-box" class="text-box">「運命の弦楽器診断」へようこそ！<br><span class="highlight-ai-retro">最新のAI</span> が３つの質問から、あなたにぴったりの弦楽器を割り出します。</div>
  <div id="options" class="options">
    <!-- ボタンが動的に入ります -->
  </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeepSound() {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'square';
  osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.08);
}

const quizData = [
  {
    question: "【第１問】舞台の上での あなたが 心惹かれる アプローチは？",
    answers: [
      { text: "１. スポットライトを浴びて、物語の先頭を駆け抜ける", id: "q1_1" },
      { text: "２. 大地のように深く静かに、土台となって空間を満たす", id: "q1_2" },
      { text: "３. 表と裏の世界を鮮やかにつなぎ、全体の響きに豊かな陰影をつくる", id: "q1_3" }
    ]
  },
  {
    question: "【第２問】音楽で 風景を描くなら、どれが しっくりくる？",
    answers: [
      { text: "１. 突き抜けるような、高く澄み渡った青空", id: "q2_1" },
      { text: "２. 深海や大樹の根のように、じっくりと広がる重厚な精神世界", id: "q2_2" },
      { text: "３. 夕暮れ時の温かみと哀愁を秘めた、居心地のよい絶妙な狭間の世界", id: "q2_3" }
    ]
  },
  {
    question: "【第３問】あなたが 音楽や 楽器に 求めるものは？",
    answers: [
      { text: "１. 豊かな響きと胸を打つ哀愁・情熱", id: "q3_1" },
      { text: "２. 重厚で深い包容力", id: "q3_2" },
      { text: "３. 心のつながりと静かな存在感", id: "q3_3" }
    ]
  }
];

const reasons = {
  q1_1: "【アプローチ】\n物語の先頭を駆け抜けたいあなた：<span class=\"hl-pink\">主旋律を歌い上げるのに最もふさわしい楽器こそがヴィオラ</span>です。人の声に最も近い温かく深い音色で主旋律を伸びやかに奏で、時に合奏全体を包み込みながら主役を張る表現力は、あなたの求める役割に完璧に合致しています。",
  q1_2: "【アプローチ】\n土台となって空間を満たしたいあなた：ヴィオラの最低音（Ｃ線）が持つ深みのある響きこそ、<span class=\"hl-pink\">アンサンブルの土台を根底から支える鍵</span>となります。全体のバランスを察知するあなたの感性に最適です。",
  q1_3: "【アプローチ】\n豊かな陰影をつくりたいあなた：ハーモニーの隙間を埋め、旋律と伴奏を結ぶ美学を理解しているあなたは、まさに<span class=\"hl-pink\">天性のヴィオラ適性</span>を持っています。",

  q2_1: "【風景】\n高く澄み渡った空間を思い描くあなた：ヴィオラは高音域で見せる表情豊かな旋律美も持ち合わせています。<span class=\"hl-pink\">澄み切った高音ソロも美しく歌い上げられる表現力</span>は、あなたのセンスそのものです。",
  q2_2: "【風景】\n重厚な世界を思い描くあなた：音の深みを鋭く捉えるセンスをお持ちです。ヴィオラ独特の渋く豊かな中低音域を的確に表現し、<span class=\"hl-pink\">空間の広がりを作り出す</span>ことができます。",
  q2_3: "【風景】\n温かみと哀愁のある中間世界を思い描くあなた：中心となる音響空間を直感的に捉えられる感性をお持ちです。<span class=\"hl-pink\">ヴィオラ奏者としてこれ以上ない資質</span>と言えます。",

  q3_1: "【欲求】\n哀愁と情熱を求めるあなた：弦楽器の中で最も人声に近く、<span class=\"hl-pink\">渋く深い哀愁を表現できるのがヴィオラ</span>です。あなたの求める豊かな情熱を余すことなく表現できます。",
  q3_2: "【欲求】\n重厚な低音を求めるあなた：ヴィオラ独特の味わい深い低音は、他の楽器にはない<span class=\"hl-pink\">唯一無二の深み</span>を持っています。音の奥行きを追求するあなたにふさわしい選択です。",
  q3_3: "【欲求】\n渋い存在感を求めるあなた：聴く者の心を揺さぶる渋い響きと、合奏の骨格を担う揺るぎない存在感。知る人ぞ知る<span class=\"hl-pink\">ヴィオラ本来のコアな魅力</span>と、あなたの卓越した美意識が完全に見合っています。"
};

let userChoices = [];
let currentStep = 0;

const textBox = document.getElementById('text-box');
const optionsContainer = document.getElementById('options');

function loadQuestion() {
  const q = quizData[currentStep];
  textBox.innerHTML = q.question;
  optionsContainer.innerHTML = '';
  
  q.answers.forEach(ans => {
    const btn = document.createElement('button');
    btn.innerText = ans.text;
    btn.onclick = () => {
      playBeepSound();
      handleAnswer(ans.id);
    };
    optionsContainer.appendChild(btn);
  });
}

function handleAnswer(ansId) {
  userChoices.push(ansId);
  currentStep++;
  
  if (currentStep < quizData.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const reason1 = reasons[userChoices[0]];
  const reason2 = reasons[userChoices[1]];
  const reason3 = reasons[userChoices[2]];

  function formatReason(rawText) {
    const parts = rawText.split('\n');
    const title = parts[0];
    const body = parts.slice(1).join('\n');
    return `<div class="reason-item">・${title}</div><div class="reason-text">${body}</div>`;
  }

  const imageUrl = "my_viola.jpg"; 
  const instrumentTitleHtml = `<div style="text-align: center; margin: 8px 0;"><span class="perfect-viola-title">【ヴィオラ（Viola）】</span></div>`;

const closingText = `判定結果はいかがでしたか？<br><br>ほら、あなたの心は、すでにヴィオラを求めているはずです。今すぐヴィオラを弾き始めてください<br><br>今回の判定は、<span class="highlight-ai-retro">最新AI</span>の厳正な診断結果です。信じてください。本当にAIがそう言ってるんです。`;
  textBox.innerHTML = `<div class="result-title">🤖 診断結果</div>` +
instrumentTitleHtml +
`<div class="result-img-container"><img src="${imageUrl}" alt="ヴィオラ" class="result-img"></div>` +
`分析完了！ あなたの回答を総合的に検証した結果、あなたに最もふさわしい楽器は<b>【ヴィオラ】</b>であると判定されました！<br>` +
`<div class="reason-box">${formatReason(reason1)}${formatReason(reason2)}${formatReason(reason3)}</div>` +
closingText;

  optionsContainer.innerHTML = '<button id="retry-btn">▶ もう一度診断する</button>';
  document.getElementById('retry-btn').onclick = () => {
    playBeepSound();
    location.reload();
  };
}

function startQuiz() {
  optionsContainer.innerHTML = '<button id="start-btn">▶ 診断を開始する</button>';
  document.getElementById('start-btn').onclick = () => {
    playBeepSound();
    loadQuestion();
  };
}

startQuiz();
</script>

</body>
</html>
